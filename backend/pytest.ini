[pytest]
testpaths = _tests
python_files = test_*.py
python_classes = *TestCase *Tests
python_functions = test_*

# Suppress known warnings that are not from our application code
# Note: Most suppression happens in conftest.py to ensure warnings are ignored
#       before pytest starts collecting them
filterwarnings =
    ignore::ResourceWarning
    ignore::DeprecationWarning
